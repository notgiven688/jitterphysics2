<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Play with Jitter2: five interactive physics scenes running in your browser.">
  <title>Jitter2 · Physics playground</title>
  <link rel="modulepreload" href="./main.js">
  <link rel="modulepreload" href="./_framework/dotnet.js">
  <style>
    :root { color-scheme: light; --page: #fcfcf9; --surface: #e8f3fa; --ink: #20374a; --muted: #536775; --border: #d5e2e8; --accent: #245bc5; }
    html.dark-theme { color-scheme: dark; --page: #1c1e24; --surface: #1c1e24; --ink: #f0f5f9; --muted: #b6c2d0; --border: #3c4b58; --accent: #8fb5ff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--page); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #page { max-width: 1000px; margin: 0 auto; padding: 32px 24px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 24px; }
    .brand { font-size: 13px; font-weight: 750; letter-spacing: .06em; }
    .brand::before { content: ''; display: inline-block; width: 9px; height: 9px; margin-right: 8px; border-radius: 50%; background: #ed795e; }
    h1 { font-size: clamp(24px, 5vw, 36px); letter-spacing: -.04em; margin: 8px 0 0; }
    a { color: var(--accent); text-underline-offset: 4px; }
    #github-link { font-size: 14px; font-weight: 650; white-space: nowrap; }
    #canvas_wrapper { position: relative; width: 100%; aspect-ratio: 4 / 3; overflow: hidden; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
    canvas.emscripten { display: block; width: 100%; height: 100%; }
    canvas:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
    .hint { color: var(--muted); font-size: 13px; line-height: 1.8; margin: 16px 0; text-align: center; }
    kbd { border: 1px solid var(--border); border-bottom-width: 2px; padding: 2px 5px; border-radius: 4px; font: inherit; color: var(--ink); }
    #spinner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: var(--surface); padding: 24px; text-align: center; font-size: 14px; color: var(--muted); }
    #spinner_animation { height: 38px; width: 38px; border: 4px solid var(--border); border-top-color: #245bc5; border-right-color: #ec795b; border-radius: 50%; animation: rotation .8s linear infinite; }
    #spinner p { margin: 0; }
    #spinner button { background: #245bc5; color: white; border: 0; padding: 12px 18px; border-radius: 6px; cursor: pointer; font: inherit; }
    html.embed-mode #page { max-width: none; padding: 0; }
    html.embed-mode header, html.embed-mode .hint { display: none; }
    html.embed-mode #canvas_wrapper { border: 0; border-radius: 0; }
    @keyframes rotation { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #spinner_animation { animation: none; } }
    @media (max-width: 500px) { #page { padding: 20px 12px; } header { align-items: flex-start; } #github-link { font-size: 12px; } }
  </style>
  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('embed') === '1') document.documentElement.classList.add('embed-mode');
    if (params.get('theme') === 'dark') document.documentElement.classList.add('dark-theme');
  </script>
</head>
<body>
  <main id="page">
    <header>
      <div><a class="brand" href="../index.html">JITTER PHYSICS 2</a><h1>A world to play with.</h1></div>
      <a id="github-link" href="https://github.com/notgiven688/jitterphysics2" target="_blank" rel="noopener">View on GitHub ↗</a>
    </header>
    <div id="canvas_wrapper">
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="0" aria-label="Interactive physics scene. Use left and right arrows to switch scenes, R to reset, or tap the scene tabs."></canvas>
      <div id="spinner" role="status"><div id="spinner_animation" aria-hidden="true"></div><p>Warming up the playground…</p></div>
    </div>
    <p class="hint">Click the scene to play · <kbd>←</kbd> <kbd>→</kbd> switch scenes · <kbd>R</kbd> reset<br>On a touchscreen? Tap a scene tab to explore.</p>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
